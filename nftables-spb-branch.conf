flush ruleset

table inet fw {

  set spb_internal {
    type ipv4_addr
    flags interval
    elements = {
      10.97.23.0/24,
      10.97.24.0/24,
      10.97.25.0/24,
      10.97.26.0/24
    }
  }

  set msk_internal {
    type ipv4_addr
    flags interval
    elements = {
      192.168.201.0/24,
      192.168.202.0/24,
      192.168.203.0/24,
      192.168.204.0/24,
      192.168.205.0/24,
      192.168.206.0/24
    }
  }

  set srv_wg_gate {
    type ipv4_addr
    elements = { 10.97.25.200 }
  }

  set srv_bastion {
    type ipv4_addr
    elements = { 10.97.26.66 }
  }

  set srv_polarproxy {
    type ipv4_addr
    elements = { 10.97.24.50 }
  }

  chain input {
    type filter hook input priority 0
    policy drop

    ct state established,related accept
    iifname "lo" accept
    ip protocol icmp accept
    ip saddr 10.97.26.0/24 tcp dport 22 accept
    udp dport 51820 accept
  }

  chain forward {
    type filter hook forward priority 0
    policy drop

    ct state established,related accept
    ct status dnat accept

    # Разрешаем ICMP для диагностики
    ip protocol icmp accept

    # Трафик между офисами
    ip saddr @spb_internal ip daddr @msk_internal accept
    ip saddr @msk_internal ip daddr @spb_internal accept

    # Доступ к VPN-шлюзу
    ip saddr @spb_internal ip daddr @srv_wg_gate tcp dport { 8888, 8787 } accept
    ip saddr @spb_internal ip daddr @srv_wg_gate udp dport 51820 accept

    # Доступ к прокси
    ip saddr 10.97.23.0/24 ip daddr @srv_polarproxy tcp dport { 3128, 8080, 80, 443 } accept

    # Доступ к файловому серверу SMB
    ip saddr 10.97.23.0/24 ip daddr 10.97.25.33 tcp dport { 139, 445 } accept

    # Доступ к DNS
    ip saddr @spb_internal ip daddr 10.97.25.44 tcp dport 53 accept
    ip saddr @spb_internal ip daddr 10.97.25.44 udp dport 53 accept

    # Выход в интернет (users и servers)
    oifname "eth_uplink" ip saddr 10.97.23.0/24 accept
    oifname "eth_uplink" ip saddr 10.97.25.0/24 tcp dport { 80, 443, 53 } accept
    oifname "eth_uplink" ip saddr 10.97.25.0/24 udp dport { 53, 123 } accept
  }

  chain output {
    type filter hook output priority 0
    policy accept
  }
}

table ip nat {
  chain PREROUTING {
    type nat hook prerouting priority -100
    # VPN-шлюз
    tcp dport 8888 counter dnat to 10.97.25.200:8888
    tcp dport 8787 counter dnat to 10.97.25.200:8787
    # Бастион (новый IP)
    tcp dport 43389 counter dnat to 10.97.26.66:3389
    udp dport 43389 counter dnat to 10.97.26.66:3389
    tcp dport 2222 counter dnat to 10.97.26.66:22
    udp dport 2222 counter dnat to 10.97.26.66:22
  }

  chain POSTROUTING {
    type nat hook postrouting priority 100
    oifname "eth_uplink" masquerade
  }
}
